
name: Build Windows and macOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 and SFML
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-sfml
            zip

      - name: Compile Windows executable
        run: |
          mkdir -p dist/CatchTheBox-Windows

          g++ -std=c++17 \
            main.cpp src/Game.cpp src/Target.cpp \
            -o dist/CatchTheBox-Windows/CatchTheBox.exe \
            -Iinclude \
            -lsfml-graphics \
            -lsfml-window \
            -lsfml-system

      - name: Package executable and dependencies
        run: |
          cp -r assets dist/CatchTheBox-Windows/

          for dll in $(ldd dist/CatchTheBox-Windows/CatchTheBox.exe | awk '/\/ucrt64\/bin\// {print $3}' | sort -u); do
            cp "$dll" dist/CatchTheBox-Windows/
          done

          cd dist
          zip -r CatchTheBox-Windows.zip CatchTheBox-Windows

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: CatchTheBox-Windows
          path: dist/CatchTheBox-Windows.zip

  build-macos:
    name: Build macOS application
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install sfml@3.0.2 dylibbundler

      - name: Build macOS application
        run: |
          SFML_PREFIX="$(brew --prefix sfml@3.0.2)"
          APP="build/CatchTheBox.app"

          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources/assets"
          mkdir -p dist

          clang++ -std=c++17 \
            main.cpp src/Game.cpp src/Target.cpp \
            -o "$APP/Contents/MacOS/CatchTheBox" \
            -Iinclude \
            -I"$SFML_PREFIX/include" \
            -L"$SFML_PREFIX/lib" \
            -Wl,-rpath,"$SFML_PREFIX/lib" \
            -lsfml-graphics \
            -lsfml-window \
            -lsfml-system

          cp assets/arialbd.ttf "$APP/Contents/Resources/assets/"

          cat > "$APP/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>CatchTheBox</string>
              <key>CFBundleIdentifier</key>
              <string>com.htrap1.catchthebox</string>
              <key>CFBundleName</key>
              <string>CatchTheBox</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Bundle SFML libraries
        run: |
          APP="build/CatchTheBox.app"
          SFML_PREFIX="$(brew --prefix sfml@3.0.2)"

          dylibbundler -od -b \
            -x "$APP/Contents/MacOS/CatchTheBox" \
            -d "$APP/Contents/Frameworks/" \
            -p "@executable_path/../Frameworks/" \
            -s "$SFML_PREFIX/lib"

      - name: Create macOS DMG
        run: |
          hdiutil create \
            -volname "CatchTheBox" \
            -srcfolder "build/CatchTheBox.app" \
            -ov \
            -format UDZO \
            "dist/CatchTheBox-macOS.dmg"

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: CatchTheBox-macOS
          path: dist/CatchTheBox-macOS.dmg
